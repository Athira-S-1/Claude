<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" style="background: #FFFFFF">
  <!-- Gold accent line -->
  <rect x="50" y="60" width="60" height="5" fill="#DFA12D"/>
  
  <!-- Header -->
  <text x="50" y="95" font-family="Segoe UI, sans-serif" font-size="12" fill="#1F2937" font-weight="400">
    CLOUDEX AI SQUAD – KOCHI
  </text>
  
  <!-- Large ASTRA title -->
  <text x="150" y="220" font-family="Segoe UI, sans-serif" font-size="72" fill="#0B1A2D" font-weight="700">
    ASTRA
  </text>
  
  <!-- Subtitle -->
  <text x="250" y="280" font-family="Segoe UI, sans-serif" font-size="24" fill="#00839F" font-weight="600">
    Autonomous Service Task &amp;
  </text>
  <text x="250" y="310" font-family="Segoe UI, sans-serif" font-size="24" fill="#00839F" font-weight="600">
    Resolution Assistant
  </text>
  
  <!-- Description -->
  <text x="330" y="360" font-family="Segoe UI, sans-serif" font-size="16" fill="#1F2937">
    An Embedded Contextual AI Assistant
  </text>
  <text x="330" y="385" font-family="Segoe UI, sans-serif" font-size="16" fill="#1F2937">
    for Enterprise IT Operations
  </text>
  
  <!-- Diagonal accent (Navy) -->
  <polygon points="600,0 1000,0 1000,750 700,750" fill="#0B1A2D" opacity="0.95"/>
  
  <!-- Diagonal accent (Teal layer) -->
  <polygon points="650,200 900,100 900,600 750,650" fill="#00839F" opacity="0.9"/>
  
  <!-- Diagonal accent (Gold layer) -->
  <polygon points="700,450 850,400 850,650 750,680" fill="#DFA12D" opacity="0.85"/>
  
  <!-- Cloud illustration -->
  <circle cx="820" cy="250" r="80" fill="none" stroke="#1D8DFF" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- ASTRA logo in cloud -->
  <text x="795" y="265" font-family="Segoe UI, sans-serif" font-size="36" fill="#1D8DFF" font-weight="700">A</text>
  
  <!-- Orbital icons -->
  <circle cx="820" cy="150" r="20" fill="#1D8DFF" opacity="0.8"/>
  <text x="812" y="159" font-size="20">📊</text>
  
  <circle cx="900" cy="250" r="20" fill="#1D8DFF" opacity="0.8"/>
  <text x="892" y="259" font-size="20">🛡️</text>
  
  <circle cx="820" cy="350" r="20" fill="#1D8DFF" opacity="0.8"/>
  <text x="812" y="359" font-size="20">💾</text>
  
  <circle cx="740" cy="250" r="20" fill="#1D8DFF" opacity="0.8"/>
  <text x="732" y="259" font-size="20">📈</text>
  
  <!-- Footer badges (left side) -->
  <text x="630" y="490" font-family="Segoe UI, sans-serif" font-size="11" fill="#1F2937">
    📅 Innovation Showcase —
  </text>
  <text x="645" y="510" font-family="Segoe UI, sans-serif" font-size="11" fill="#1F2937">
    Leadership Review
  </text>
  
  <text x="630" y="550" font-family="Segoe UI, sans-serif" font-size="11" fill="#1F2937">
    🎯 Version 2.0
  </text>
  
  <text x="630" y="590" font-family="Segoe UI, sans-serif" font-size="11" fill="#1F2937">
    📅 August 2026
  </text>
  
  <!-- Navy footer bar -->
  <rect x="0" y="680" width="1000" height="70" fill="#0B1A2D"/>
  
  <!-- Footer text with shield -->
  <text x="70" y="715" font-family="Segoe UI, sans-serif" font-size="14" fill="#FFFFFF">
    🛡️  Governed. Contextual. Autonomous.
  </text>
  <text x="85" y="735" font-family="Segoe UI, sans-serif" font-size="11" fill="#FFFFFF">
    Every action. Every record. Every time.
  </text>
</svg>
